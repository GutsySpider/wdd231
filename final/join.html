<body>
    <header>
        <img src="images/spider-black-widow.svg" alt="Site Logo" width="24" height="24">
        <span>Gutsy's Spider Web</span>
        <button id="hamburger" title="hamburger" class="hamburger"></button>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a href="index.html"> Home </a></li>
            <li><a href="leaderboard.html"> Leaderboard </a></li>
            <li class="current"><a href="join.html"> Join </a></li>
        </ul>

    </nav>

    <main>
        <div class="hero">
            <img src="images/gutsyspider_banner.webp" alt="Hero Image">
        </div>

        <h1>Join Us</h1>
        <div class="joinformat">
            <form method="GET" action="thanks.html" class="joinweb">
                <h2>Member Application Form</h2>

                <label>First Name <input type="text" name="first" required autocomplete="given-name"
                        title="Your First Name"></label>

                <label>Last Name <input type="text" name="last" required autocomplete="family-name"
                        title="Your Last Name"></label>

                <label>Gamertag <input type="text" name="gamertag" required autocomplete="off"
                        title="Your Gamertag"></label>

                <label>Email <input type="email" name="email" required placeholder="john89@gmail.com" title="Your Email"
                        autocomplete="email"></label>

                <label>Cell Phone <input type="tel" name="phone" required autocomplete="tel"
                        title="A Phone Number with dashes" placeholder="987-555-1234"></label>


                <label>Select Gaming Platform
                    <select name="platform" id="reason" onchange="showOtherInput()">
                        <option value="" disabled selected>Select</option>
                        <option value="xbox">Xbox</option>
                        <option value="playstation">Playstation</option>
                        <option value="pc">PC</option>
                        <option value="other">Other (please specify)</option>
                    </select>

                </label>

                <div id="otherContainer">
                    <label for="otherDescription">Please specify:
                    <input type="text" id="otherDescription" name="other description"></label>
                </div>

                <label>Gaming Experiance<textarea name="description" rows="5" cols="45" title="Description"
                        placeholder="Enter games you are interested in."></textarea></label>

                <input type="hidden" name="hidden" id="hidden">

                <input type="submit" value="Join The Web">
            </form>
        </div>
    </main>
    <footer>
        <div class="contact">
            <p>Gutsy's Spider Web</p>
            <p>123 E Spider Lane, Trouble, CA 93555</p>
            <p>GutsySays@Webs.com 426-277-4337</p>
        </div>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/gutsyspidertwitch/">
                <img src="images/instagram-circle.svg" alt="Instagram" width="48" height="48">
            </a>
            <a href="https://www.twitch.tv/gutsyspider">
                <img src="images/twitch-circle.svg" alt="Twitch" width="48" height="48">
            </a>
            <a href="https://www.youtube.com/@gutsyspider">
                <img src="images/youtube-circle.svg" alt="YouTube" width="48" height="48">
            </a>
            <a href="https://x.com/GutsySpider1">
                <img src="images/twitter-alt-circle.svg" alt="X" width="48" height="48">
            </a>
            <a href="https://www.facebook.com/GutsySpider/">
                <img src="images/facebook.svg" alt="Facebook" width="48" height="48">
            </a>
        </nav>

        <div class="lastModified">
            <p>
                <span class="copywrite">
                    &copy; <span id="year"></span> 🚁 Michael Bowman 🚁 USA
                </span>
            </p>


            <p>
                <span class="modified">Last Modified: <span id="lastModified"></span></span>
            </p>
